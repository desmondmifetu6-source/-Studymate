name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger anytime via GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare Offline Web Assets for APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html styles.css app.js manifest.json icon.svg lottie.min.js android/app/src/main/assets/www/
          cp -r *.json *.png *.jpg *.webm android/app/src/main/assets/www/ 2>/dev/null || true
          ls -la android/app/src/main/assets/www/

      - name: Build Standalone Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyMate-GH-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
