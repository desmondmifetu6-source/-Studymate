name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Prepare Offline Web Assets for APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html styles.css app.js manifest.json icon.svg lottie.min.js android/app/src/main/assets/www/ 2>/dev/null || true
          find . -maxdepth 1 -type f \( -name "*.png" -o -name "*.jpg" \) -exec cp {} android/app/src/main/assets/www/ \; 2>/dev/null || true
          echo "=== Web assets in APK ==="
          ls -la android/app/src/main/assets/www/

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version=8.4 --distribution-type=bin
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $BUILD_EXIT
          fi

      - name: Upload Build Log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: android/build.log

      - name: Upload Installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StudyMate-GH-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
