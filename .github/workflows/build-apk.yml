name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Set Android SDK location & Accept Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare Offline Web Assets for APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html styles.css app.js manifest.json icon.svg lottie.min.js android/app/src/main/assets/www/
          find . -maxdepth 1 -type f \( -name "*.json" -o -name "*.png" -o -name "*.jpg" -o -name "*.webm" \) -exec cp {} android/app/src/main/assets/www/ \;
          ls -la android/app/src/main/assets/www/

      - name: Build Standalone Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace > build.log 2>&1 || (echo "### ❌ Build Log Failure Details" >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && tail -n 80 build.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && cat build.log && exit 1)

      - name: Upload Build Log if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Error-Log
          path: android/build.log

      - name: Upload Installable APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StudyMate-GH-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
